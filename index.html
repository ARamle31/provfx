  <title>ProVFX SaaS</title>
  <script>
    (function (l) {
      if (l.search) {
        var params = new URLSearchParams(l.search);
        var p = params.get('p');
        if (p !== null) {
          var newPath = (l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname) + p;
          window.history.replaceState(null, null, newPath + l.hash);
        }
      }
    }(window.location));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bodoni+Moda:wght@400;700;900&display=swap"
    rel="stylesheet">
</head>
